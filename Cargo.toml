[workspace]
resolver = "2"
members = [
    "crates/excel-reader",
    "crates/excel-writer",
    "crates/excel-editor",
    "crates/ooxml-patch",
    "sidecar/lo-convert",
    "audit-core",
]
exclude = [
    "vendor/betteroffice-xlsx-model",
    "vendor/betteroffice-xlsx-calc",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
# Linux 原生文件选择器：XDG Desktop Portal（zbus 纯 Rust D-Bus，不引入
# libdbus/GTK 系统依赖）；仅 audit-core 的 Linux 目标启用。
ashpd = { version = "0.13", default-features = false, features = ["file_chooser", "tokio"] }
axum = "0.8"
betteroffice-xlsx = { version = "0.5.1", default-features = false }
betteroffice-xlsx-calc = { version = "0.5.1", default-features = false }
calamine = "=0.37.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
encoding_rs = "0.8"
rayon = "1"
regex = "1"
roxmltree = "0.21"
rust_xlsxwriter = "=0.101.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
umya-spreadsheet = "=3.1.1"
# Windows 原生文件选择器：IFileOpenDialog（COM）；default-features=false
# 以排除 Linux 门户/wayland 依赖，Windows 目标只编译 win32 后端。
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
zip = "6"

# vendor 修改版 betteroffice（见 vendor/VENDOR_NOTES.md）：
# content_range() 内容范围 + 记忆化、重算预算运行时可配。
# 版本保持 0.5.1，[patch.crates-io] 以 path 替换，--offline 构建通过。
[patch.crates-io]
betteroffice-xlsx-model = { path = "vendor/betteroffice-xlsx-model" }
betteroffice-xlsx-calc = { path = "vendor/betteroffice-xlsx-calc" }
